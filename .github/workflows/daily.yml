name: daily-prep
on:
  schedule:
    - cron: '30 7 * * 1-5'   # 台灣 15:30
    - cron: '30 9 * * 1-5'   # 台灣 17:30 再補跑一次
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - run: python prep.py
      - name: save data
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "daily data" && git pull --rebase && git push)
