name: intraday-scan
on:
  schedule:
    - cron: '*/5 1-5 * * 1-5'   # 台灣 09:00–13:55，程式自己只在 13:35 前跑
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python live.py
      - name: save data
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "live $(date -u +%H:%M)" && git pull --rebase && git push)
